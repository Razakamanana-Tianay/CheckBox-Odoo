name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # claude plugin validate is a local schema check, no auth needed
      # (verified against code.claude.com/docs, 2026-09-17).
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate plugins/checkbox
      - run: claude plugin validate . --strict

      - run: python3 scripts/check_rule_copies.py
